<!DOCTYPE html>
<html>
<head>
    <title>CS Branch Suitability Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .result-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .result-card {
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 550px;
            width: 100%;
        }

        .result-card h1 {
            color: #1f3c88;
            margin-bottom: 10px;
        }

        .score {
            font-size: 26px;
            font-weight: bold;
            margin: 15px 0;
            color: #2c6bed;
        }

        .result-text {
            margin: 20px 0;
            font-size: 18px;
            color: #333;
        }

        .btn-dashboard {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: linear-gradient(120deg, #1f3c88, #2c6bed);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-dashboard:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="result-card">

    {% if prediction %}
        <h1>Recommended Branch</h1>

        <div class="score">
            {{ prediction }}
        </div>

        <div class="result-text">
            Based on your responses, this branch best matches your aptitude and interests.
        </div>

    {% else %}
        <h1>CS Branch Suitability Result</h1>

        <div class="score">
            Your CS Aptitude Score: {{ test_percent|round(1) }}%
        </div>

        <div class="result-text">
            {{ result }}
        </div>
    {% endif %}

    <a href="{{ url_for('dashboard') }}" class="btn-dashboard">
        Back to Dashboard
    </a>
</div>

</div>

</body>
</html>
