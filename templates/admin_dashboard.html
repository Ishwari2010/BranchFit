<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | BranchFit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="dashboard-container">

    <div class="sidebar">
        <h2>BranchFit</h2>
        <ul>
            <li class="active">Dashboard</li>
            <li><a href="{{ url_for('manage_questions') }}">Question Bank</a></li>
            <li><a href="{{ url_for('manage_branch_questions') }}">Branch Test Questions</a></li>
            <li><a href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1>Welcome, {{ user_name }}</h1>
        <p class="subtitle">Administrator Control Panel</p>

        <div class="card-grid">

            <div class="card">
                <h3>Manage Questions</h3>
                <p>Add and view aptitude questions.</p>
                <a href="{{ url_for('manage_questions') }}">
                    <button>Open Question Bank</button>
                </a>
            </div>

            <div class="card">
                <h3>Manage Branch Tests</h3>
                <p>Add, edit, and delete branch-specific aptitude questions.</p>
                <a href="{{ url_for('manage_branch_questions') }}">
                    <button>Open Branch Question Manager</button>
                </a>
            </div>


        </div>
    </div>

</div>

</body>
</html>
